<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fraud Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --sidebar: #eef0f4;
    --ink: #151a22;
    --muted: #667085;
    --line: #e2e5ea;
    --accent: #1b5fd1;
    --accent-ink: #ffffff;
    --user-bg: #e8effc;
    --warn-bg: #fff6e0;
    --warn-line: #f0d9a0;
    --ok: #1c7c4d;
    --radius: 14px;
    --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    --bg: #12151b;
    --panel: #181c24;
    --sidebar: #0f1217;
    --ink: #e8ebf0;
    --muted: #8b95a5;
    --line: #272d38;
    --accent: #5b94f5;
    --accent-ink: #0b1220;
    --user-bg: #1f2a40;
    --warn-bg: #2a2412;
    --warn-line: #5a4a1c;
    --ok: #4cc38a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.55; }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { display: grid; grid-template-columns: 260px 1fr 320px; height: 100%; }

  /* ---------- sidebar ---------- */
  .sidebar { background: var(--sidebar); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 6px 14px; font-weight: 600; font-size: 16px; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
          display: grid; place-items: center; font-weight: 600; font-size: 14px; }
  .new-case { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 12px; text-align: left; font-weight: 500; }
  .new-case:hover { border-color: var(--accent); }
  .cases { margin-top: 14px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .cases-title { color: var(--muted); font-size: 13px; padding: 4px 8px; }
  .case { display: flex; align-items: center; justify-content: space-between; gap: 6px; border: 0; background: transparent;
          padding: 8px 10px; border-radius: 8px; text-align: left; width: 100%; }
  .case:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .case.active { background: var(--panel); box-shadow: 0 0 0 1px var(--line); font-weight: 500; }
  .case .del { opacity: 0; border: 0; background: transparent; color: var(--muted); padding: 0 4px; font-size: 16px; }
  .case:hover .del, .case.active .del { opacity: 1; }
  .side-foot { padding-top: 10px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .ghost { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px; font-size: 13px; }

  /* ---------- chat ---------- */
  .chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
  .chat-head { padding: 14px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 12px; background: var(--panel); }
  .chat-head h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .chat-head span { color: var(--muted); font-size: 13px; }
  .scroll { flex: 1; overflow-y: auto; padding: 24px 24px 8px; }
  .thread { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  .empty { max-width: 760px; margin: 8vh auto 0; text-align: left; }
  .empty h2 { font-size: 26px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
  .empty p { color: var(--muted); margin: 0 0 22px; }
  .chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .chip { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; font-size: 14px; }
  .chip:hover { border-color: var(--accent); }
  .chip small { display: block; color: var(--muted); margin-top: 2px; font-size: 12.5px; }

  .row { display: flex; gap: 12px; }
  .row.user { justify-content: flex-end; }
  .avatar { flex: none; width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
            display: grid; place-items: center; font-size: 12px; font-weight: 600; margin-top: 2px; }
  .bubble { max-width: 100%; }
  .user .bubble { background: var(--user-bg); padding: 10px 14px; border-radius: var(--radius); max-width: 80%; white-space: pre-wrap; }
  .bot .bubble { flex: 1; min-width: 0; padding-top: 2px; }
  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0 0 10px; padding-left: 22px; }
  .bubble li { margin: 3px 0; }
  .bubble code { font-family: var(--mono); font-size: 13px; background: color-mix(in srgb, var(--ink) 8%, transparent); padding: 1px 5px; border-radius: 5px; }
  .bubble.error { color: #b42318; }
  :root[data-theme="dark"] .bubble.error { color: #ff8a7a; }
  .meta { margin-top: 6px; display: flex; gap: 8px; }
  .meta button { border: 0; background: transparent; color: var(--muted); font-size: 12.5px; padding: 2px 6px; border-radius: 6px; }
  .meta button:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }

  .typing { display: inline-flex; gap: 4px; padding: 8px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  .typing-note { color: var(--muted); font-size: 13px; margin-left: 8px; }

  .composer-wrap { padding: 10px 24px 18px; }
  .composer { max-width: 760px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
              display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 16px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
  .composer:focus-within { border-color: var(--accent); }
  .composer textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink);
                       font: inherit; max-height: 180px; padding: 8px 0; }
  .send { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink);
          display: grid; place-items: center; font-size: 18px; flex: none; }
  .send:disabled { opacity: .4; cursor: not-allowed; }
  .hint { max-width: 760px; margin: 8px auto 0; text-align: center; color: var(--muted); font-size: 12.5px; }

  /* ---------- actions panel ---------- */
  .actions { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .actions-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .actions-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .actions-body { padding: 14px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .actions-note { color: var(--muted); font-size: 13px; margin: 0; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .card.pending { background: var(--warn-bg); border-color: var(--warn-line); }
  .card h4 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .card p { margin: 0 0 8px; font-size: 13.5px; color: var(--muted); }
  .status { font-size: 12.5px; font-weight: 500; }
  .status.done { color: var(--ok); }
  .approve { border: 0; background: var(--accent); color: var(--accent-ink); padding: 7px 12px; border-radius: 8px; font-weight: 500; font-size: 13.5px; }

  .toggle-panel { display: none; }
  @media (max-width: 1000px) {
    .app { grid-template-columns: 220px 1fr; }
    .actions { position: fixed; right: 0; top: 0; bottom: 0; width: min(340px, 90vw); transform: translateX(100%); transition: transform .2s; z-index: 5; box-shadow: -8px 0 24px rgba(0,0,0,.15); }
    .actions.open { transform: none; }
    .toggle-panel { display: inline-block; }
  }
  @media (max-width: 680px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .chips { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand"><div class="logo">F</div> Fraud Copilot</div>
    <button class="new-case" id="newCase">+ New case</button>
    <div class="cases-title" style="margin-top:16px">Cases</div>
    <div class="cases" id="cases"></div>
    <div class="side-foot">
      <button class="ghost" id="theme">Dark mode</button>
    </div>
  </aside>

  <main class="chat">
    <div class="chat-head">
      <h1 id="caseTitle">Case A1</h1>
      <span>Recommendations only. A human analyst decides.</span>
      <span style="margin-left:auto"><button class="ghost toggle-panel" id="openPanel">Actions</button></span>
    </div>
    <div class="scroll" id="scroll">
      <div class="thread" id="thread"></div>
    </div>
    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Ask about a customer, a transaction, or the fraud playbook"></textarea>
        <button class="send" id="send" aria-label="Send message">&#8593;</button>
      </div>
      <div class="hint">Enter to send, Shift+Enter for a new line. Card numbers are masked before they reach the model.</div>
    </div>
  </main>

  <aside class="actions" id="panel">
    <div class="actions-head">
      <h3>Proposed actions</h3>
      <button class="ghost" id="refresh">Refresh</button>
    </div>
    <div class="actions-body" id="actionsBody"></div>
  </aside>
</div>

<script>
  const API = "http://localhost:8080";
  const STORE = "fraudCopilot.v1";

  const $ = id => document.getElementById(id);
  const thread = $("thread"), scrollEl = $("scroll"), input = $("input"), sendBtn = $("send");

  /* ---------- state (kept in this browser only) ---------- */
  let state = load() || { active: "A1", cases: { A1: [] } };
  function load() { try { return JSON.parse(localStorage.getItem(STORE)); } catch { return null; } }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch {} }
  let busy = false;

  /* ---------- safe mini-markdown: escape first, then format ---------- */
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function inline(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function render(text) {
    const lines = text.split(/\r?\n/);
    let html = "", list = null, para = [];
    const flushPara = () => { if (para.length) { html += "<p>" + para.join("<br>") + "</p>"; para = []; } };
    const flushList = () => { if (list) { html += `</${list}>`; list = null; } };
    for (const raw of lines) {
      const ul = raw.match(/^\s*[-*]\s+(.*)/), ol = raw.match(/^\s*\d+[.)]\s+(.*)/);
      if (ul || ol) {
        flushPara();
        const kind = ul ? "ul" : "ol";
        if (list !== kind) { flushList(); html += `<${kind}>`; list = kind; }
        html += "<li>" + inline((ul || ol)[1]) + "</li>";
      } else if (raw.trim() === "") { flushPara(); flushList(); }
      else { flushList(); para.push(inline(raw)); }
    }
    flushPara(); flushList();
    return html;
  }

  /* ---------- sidebar ---------- */
  function renderCases() {
    const box = $("cases"); box.replaceChildren();
    for (const id of Object.keys(state.cases)) {
      const b = document.createElement("button");
      b.className = "case" + (id === state.active ? " active" : "");
      const name = document.createElement("span"); name.textContent = "Case " + id;
      const del = document.createElement("span"); del.className = "del"; del.textContent = "\u00d7"; del.title = "Delete case";
      del.onclick = e => { e.stopPropagation(); removeCase(id); };
      b.append(name, del);
      b.onclick = () => switchCase(id);
      box.appendChild(b);
    }
    $("caseTitle").textContent = "Case " + state.active;
  }
  function switchCase(id) { state.active = id; save(); renderCases(); renderThread(); input.focus(); }
  function removeCase(id) {
    if (Object.keys(state.cases).length === 1) { state.cases[id] = []; }
    else { delete state.cases[id]; if (state.active === id) state.active = Object.keys(state.cases)[0]; }
    save(); renderCases(); renderThread();
  }
  $("newCase").onclick = () => {
    let n = 1; while (state.cases["A" + n]) n++;
    const id = prompt("Case ID (letters, digits, dash)", "A" + n);
    if (!id) return;
    const clean = id.trim().replace(/[^A-Za-z0-9-]/g, "");
    if (!clean) return;
    if (!state.cases[clean]) state.cases[clean] = [];
    switchCase(clean);
  };

  /* ---------- thread ---------- */
  const SUGGESTIONS = [
    ["Investigate customer C1001", "Fetches transactions and checks them"],
    ["Is travel from Hyderabad to Dubai in 120 minutes possible?", "Runs the travel feasibility check"],
    ["What does the playbook say about card testing?", "Answers from the fraud playbook"],
    ["Propose a block for C1001 if risk is high", "Creates an action for you to approve"]
  ];

  function renderThread() {
    thread.replaceChildren();
    const msgs = state.cases[state.active] || [];
    if (!msgs.length) {
      const e = document.createElement("div"); e.className = "empty";
      const h = document.createElement("h2"); h.textContent = "What would you like to investigate?";
      const p = document.createElement("p"); p.textContent = "Start with a customer ID, a transaction, or a policy question.";
      const chips = document.createElement("div"); chips.className = "chips";
      for (const [t, sub] of SUGGESTIONS) {
        const c = document.createElement("button"); c.className = "chip"; c.textContent = t;
        const s = document.createElement("small"); s.textContent = sub; c.appendChild(s);
        c.onclick = () => { input.value = t; send(); };
        chips.appendChild(c);
      }
      e.append(h, p, chips); thread.appendChild(e);
      return;
    }
    for (const m of msgs) thread.appendChild(buildMsg(m));
    toBottom();
  }

  function buildMsg(m) {
    const row = document.createElement("div"); row.className = "row " + (m.role === "user" ? "user" : "bot");
    const bubble = document.createElement("div"); bubble.className = "bubble" + (m.error ? " error" : "");
    if (m.role === "user") { bubble.textContent = m.text; row.appendChild(bubble); return row; }
    const av = document.createElement("div"); av.className = "avatar"; av.textContent = "F";
    if (m.error) bubble.textContent = m.text; else bubble.innerHTML = render(m.text);
    const wrap = document.createElement("div"); wrap.style.flex = "1"; wrap.style.minWidth = 0;
    wrap.appendChild(bubble);
    const meta = document.createElement("div"); meta.className = "meta";
    const copy = document.createElement("button"); copy.textContent = "Copy";
    copy.onclick = () => { navigator.clipboard.writeText(m.text); copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1200); };
    meta.appendChild(copy); wrap.appendChild(meta);
    row.append(av, wrap); return row;
  }

  function typingRow() {
    const row = document.createElement("div"); row.className = "row bot"; row.id = "typing";
    const av = document.createElement("div"); av.className = "avatar"; av.textContent = "F";
    const b = document.createElement("div"); b.className = "bubble";
    b.innerHTML = '<span class="typing"><i></i><i></i><i></i></span><span class="typing-note">Checking data and policy. Local models can take a few seconds.</span>';
    row.append(av, b); return row;
  }
  function toBottom() { scrollEl.scrollTop = scrollEl.scrollHeight; }

  // A bot message row whose bubble we fill in as tokens arrive
  function liveRow() {
    const row = document.createElement("div"); row.className = "row bot";
    const av = document.createElement("div"); av.className = "avatar"; av.textContent = "F";
    const wrap = document.createElement("div"); wrap.style.flex = "1"; wrap.style.minWidth = 0;
    const bubble = document.createElement("div"); bubble.className = "bubble";
    wrap.appendChild(bubble); row.append(av, wrap);
    return { row, bubble };
  }

  /* ---------- send ---------- */
  async function send() {
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true; sendBtn.disabled = true;
    const id = state.active;
    state.cases[id].push({ role: "user", text });
    input.value = ""; autosize(); save(); renderThread();
    const t = typingRow(); thread.appendChild(t); toBottom();
    let acc = "", live = null;
    try {
      const url = `${API}/agent/${encodeURIComponent(id)}/stream?message=${encodeURIComponent(text)}`;
      const res = await fetch(url, { headers: { Accept: "text/event-stream" } });
      if (!res.ok) throw new Error("Server returned " + res.status);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        // network chunks do not line up with events, so buffer until a blank line
        buf += decoder.decode(value, { stream: true }).replace(/\r\n/g, "\n");
        const events = buf.split("\n\n");
        buf = events.pop();                       // keep the unfinished event
        for (const ev of events) {
          for (const line of ev.split("\n")) {
            if (line.startsWith("data:")) acc += JSON.parse(line.slice(5)).t;
          }
        }
        if (acc && state.active === id) {
          if (!live) { t.remove(); live = liveRow(); thread.appendChild(live.row); }
          live.bubble.innerHTML = render(acc);    // render() escapes HTML first
          toBottom();
        }
      }
      if (!acc) throw new Error("The agent returned an empty reply");
      state.cases[id].push({ role: "bot", text: acc });
    } catch (e) {
      if (acc) {
        state.cases[id].push({ role: "bot", text: acc + "\n\n(The stream was interrupted: " + e.message + ")" });
      } else {
        state.cases[id].push({ role: "bot", error: true,
          text: "Could not reach the agent (" + e.message + "). Check that the backend is running on " + API + " and that Ollama is up." });
      }
    }
    busy = false; sendBtn.disabled = false; save();
    if (state.active === id) renderThread();
    loadActions(); input.focus();
  }
  sendBtn.onclick = send;
  input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; }
  input.addEventListener("input", autosize);

  /* ---------- proposed actions ---------- */
  async function loadActions() {
    const body = $("actionsBody"); body.replaceChildren();
    try {
      const res = await fetch(`${API}/actions`);
      const list = await res.json();
      if (!list.length) {
        const p = document.createElement("p"); p.className = "actions-note";
        p.textContent = "Nothing proposed yet. When the copilot recommends blocking a card, it appears here for your decision.";
        body.appendChild(p); return;
      }
      for (const a of list) {
        const card = document.createElement("div");
        const pending = a.status === "PENDING_APPROVAL";
        card.className = "card" + (pending ? " pending" : "");
        const h = document.createElement("h4"); h.textContent = "Block card for " + a.customerId;
        const p = document.createElement("p"); p.textContent = a.reason;
        card.append(h, p);
        if (pending) {
          const b = document.createElement("button"); b.className = "approve"; b.textContent = "Approve block";
          b.onclick = async () => { b.disabled = true; await fetch(`${API}/actions/${a.id}/approve`, { method: "POST" }); loadActions(); };
          card.appendChild(b);
        } else {
          const s = document.createElement("span"); s.className = "status done"; s.textContent = "Approved and executed";
          card.appendChild(s);
        }
        body.appendChild(card);
      }
    } catch {
      const p = document.createElement("p"); p.className = "actions-note";
      p.textContent = "Could not load actions. Is the backend running?"; body.appendChild(p);
    }
  }
  $("refresh").onclick = loadActions;
  $("openPanel").onclick = () => $("panel").classList.toggle("open");

  /* ---------- theme ---------- */
  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    $("theme").textContent = t === "dark" ? "Light mode" : "Dark mode";
    try { localStorage.setItem("fraudCopilot.theme", t); } catch {}
  }
  $("theme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  let saved = null; try { saved = localStorage.getItem("fraudCopilot.theme"); } catch {}
  setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

  /* ---------- start ---------- */
  renderCases(); renderThread(); loadActions(); input.focus();
</script>
</body>
</html>
