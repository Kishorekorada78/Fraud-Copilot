spring.application.name=Fraud Copilot

spring.ai.ollama.chat.options.model=llama3.1

#: Pull an embedding model
spring.ai.ollama.embedding.options.model=nomic-embed-text

spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}

logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# Streaming Response
spring.mvc.async.request-timeout=180s

# --- database (defaults work when the app runs in STS and the DB runs in Docker) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/fraud}
spring.datasource.username=${DB_USER:fraud}
spring.datasource.password=${DB_PASSWORD:fraud}

# --- pgvector ---
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

# --- persistent chat memory ---
spring.ai.chat.memory.repository.jdbc.initialize-schema=always